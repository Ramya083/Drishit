name: drishti
description: A voice-activated AI vision assistant prototype for visually impaired users.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5

  # Required libraries
  camera: ^0.10.0+6
  speech_to_text: ^5.8.0
  flutter_tts: ^3.6.4
  http: ^0.13.6
  path_provider: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
